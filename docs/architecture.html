<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>News Pipeline Architecture</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
    --accent: #4f46e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
      --accent: #818cf8;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 1100px; margin: 32px auto; padding: 0 20px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 22px; font-weight: 700; fill: var(--fg); }
  .label { font-size: 13px; font-weight: 600; fill: var(--fg); }
  .small { font-size: 11px; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1.5; rx: 8; }
  .neutral { fill: var(--neutral); }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .edge-accent { stroke: var(--accent); stroke-width: 2; fill: none; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.5; }
  .badge { font-size: 10px; font-weight: 700; fill: var(--accent); }
</style>
<main>
<svg viewBox="0 0 1080 685" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4f46e5" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="540" y="30" text-anchor="middle" class="title">Serverless AI News Pipeline — Architecture</text>

  <!-- AWS Zone -->
  <rect x="30" y="55" width="1020" height="490" rx="12" class="zone" />
  <text x="50" y="78" class="small">AWS eu-central-1</text>

  <!-- Row 1: Sources → Lambda Pipeline → Storage -->

  <!-- RSS Sources -->
  <rect x="50" y="100" width="130" height="70" rx="8" class="node external" />
  <text x="115" y="128" text-anchor="middle" class="label">44 RSS</text>
  <text x="115" y="146" text-anchor="middle" class="label">Sources</text>
  <text x="115" y="160" text-anchor="middle" class="small">US · EU · Asia</text>

  <!-- EventBridge -->
  <rect x="50" y="210" width="130" height="50" rx="8" class="node neutral" />
  <text x="115" y="232" text-anchor="middle" class="label">EventBridge</text>
  <text x="115" y="248" text-anchor="middle" class="small">cron 05:00 UTC</text>

  <!-- Lambda Pipeline -->
  <rect x="240" y="100" width="170" height="160" rx="8" class="node process" />
  <text x="325" y="125" text-anchor="middle" class="label">Lambda Pipeline</text>
  <line x1="260" y1="135" x2="390" y2="135" stroke="#64748b" stroke-width="0.5" opacity="0.4" />
  <text x="325" y="152" text-anchor="middle" class="small">① Fetch (parallel)</text>
  <text x="325" y="170" text-anchor="middle" class="small">② Dedup (URL hash)</text>
  <text x="325" y="188" text-anchor="middle" class="small">③ Filter (keywords)</text>
  <text x="325" y="206" text-anchor="middle" class="small">④ AI Summary (Ollama)</text>
  <text x="325" y="224" text-anchor="middle" class="small">⑤ Embed (256-dim)</text>
  <text x="325" y="242" text-anchor="middle" class="small">⑥ Score + PDF</text>

  <!-- DynamoDB Articles -->
  <rect x="470" y="100" width="140" height="80" rx="8" class="node storage" />
  <text x="540" y="128" text-anchor="middle" class="label">DynamoDB</text>
  <text x="540" y="146" text-anchor="middle" class="label">Articles</text>
  <text x="540" y="164" text-anchor="middle" class="small">+ embeddings</text>
  <text x="540" y="176" text-anchor="middle" class="small">TTL 14d</text>

  <!-- DynamoDB Reports -->
  <rect x="470" y="210" width="140" height="50" rx="8" class="node storage" />
  <text x="540" y="232" text-anchor="middle" class="label">DynamoDB</text>
  <text x="540" y="248" text-anchor="middle" class="small">Reports · TTL 30d</text>

  <!-- S3 -->
  <rect x="670" y="100" width="140" height="80" rx="8" class="node storage" />
  <text x="740" y="128" text-anchor="middle" class="label">S3</text>
  <text x="740" y="146" text-anchor="middle" class="small">PDF reports/</text>
  <text x="740" y="160" text-anchor="middle" class="small">JSON archive/</text>
  <text x="740" y="174" text-anchor="middle" class="small">config/ · TTL 14d</text>

  <!-- S3 Demo UI -->
  <rect x="670" y="210" width="140" height="50" rx="8" class="node external" />
  <text x="740" y="232" text-anchor="middle" class="label">S3 Website</text>
  <text x="740" y="248" text-anchor="middle" class="small">Demo UI</text>

  <!-- SSM -->
  <rect x="240" y="290" width="170" height="50" rx="8" class="node neutral" />
  <text x="325" y="312" text-anchor="middle" class="label">SSM Parameter Store</text>
  <text x="325" y="328" text-anchor="middle" class="small">API keys · models (SecureString)</text>

  <!-- Row 2: API Layer -->
  <line x1="30" y1="370" x2="1050" y2="370" stroke="#64748b" stroke-width="0.5" opacity="0.3" />
  <text x="50" y="392" class="small">API Layer</text>

  <!-- API Gateway -->
  <rect x="240" y="405" width="140" height="60" rx="8" class="node input" />
  <text x="310" y="430" text-anchor="middle" class="label">API Gateway</text>
  <text x="310" y="448" text-anchor="middle" class="small">REST · v1 · API key</text>
  <text x="310" y="462" text-anchor="middle" class="small">/demo/* public · 5 rps</text>

  <!-- Lambda API -->
  <rect x="440" y="405" width="130" height="60" rx="8" class="node process" />
  <text x="505" y="430" text-anchor="middle" class="label">Lambda API</text>
  <text x="505" y="448" text-anchor="middle" class="small">/health · /report</text>

  <!-- Lambda Search -->
  <rect x="630" y="405" width="130" height="60" rx="8" class="node process" />
  <text x="695" y="430" text-anchor="middle" class="label">Lambda Search</text>
  <text x="695" y="448" text-anchor="middle" class="small">/search (cosine sim)</text>

  <!-- Lambda Demo (public, read-only) -->
  <rect x="630" y="475" width="130" height="60" rx="8" class="node process" />
  <text x="695" y="497" text-anchor="middle" class="label">Lambda Demo</text>
  <text x="695" y="513" text-anchor="middle" class="small">/demo/* read-only</text>

  <!-- Client -->
  <rect x="850" y="405" width="130" height="60" rx="8" class="node external" />
  <text x="915" y="430" text-anchor="middle" class="label">Client</text>
  <text x="915" y="448" text-anchor="middle" class="small">curl · browser</text>

  <!-- Row 3: CI/CD -->
  <line x1="30" y1="560" x2="1050" y2="560" stroke="#64748b" stroke-width="0.5" opacity="0.3" />
  <text x="50" y="582" class="small">CI/CD</text>

  <rect x="50" y="590" width="970" height="12" rx="6" fill="#4338ca" opacity="0.15" />
  <text x="540" y="600" text-anchor="middle" class="badge">GitHub Actions: CI (ruff + pytest + terraform fmt/validate) → Security (Checkov) → Deploy (build + terraform apply + API Gateway) → Weekly: Drift Detection</text>

  <!-- Edges: Sources → Lambda -->
  <path d="M180 135 L240 135" class="edge" marker-end="url(#arrow)" />
  <!-- EventBridge → Lambda -->
  <path d="M115 210 L115 175 L240 175" class="edge" marker-end="url(#arrow)" />
  <!-- Lambda → DynamoDB Articles -->
  <path d="M410 140 L470 140" class="edge" marker-end="url(#arrow)" />
  <!-- Lambda → DynamoDB Reports -->
  <path d="M410 220 L470 235" class="edge" marker-end="url(#arrow)" />
  <!-- Lambda → S3 -->
  <path d="M410 160 L670 140" class="edge" marker-end="url(#arrow)" />
  <!-- Lambda → S3 Demo -->
  <path d="M410 240 L670 235" class="edge" marker-end="url(#arrow)" />
  <!-- SSM → Lambda -->
  <path d="M325 290 L325 260" class="edge" marker-end="url(#arrow)" />
  <!-- API GW → Lambda API -->
  <path d="M380 435 L440 435" class="edge" marker-end="url(#arrow)" />
  <!-- API GW → Lambda Search -->
  <path d="M380 445 L630 435" class="edge" marker-end="url(#arrow)" />
  <!-- Lambda Search → DynamoDB Articles -->
  <path d="M695 405 L695 370 L540 370 L540 180" class="edge" marker-end="url(#arrow)" />
  <!-- Lambda API → S3 (presigned) -->
  <path d="M505 405 L505 370 L740 370 L740 180" class="edge" marker-end="url(#arrow)" />
  <!-- API GW → Lambda Demo -->
  <path d="M380 450 L630 500" class="edge" marker-end="url(#arrow)" />
  <!-- Client → API GW -->
  <path d="M850 435 L380 435" class="edge-accent" marker-end="url(#arrow-accent)" />
</svg>
</main>
