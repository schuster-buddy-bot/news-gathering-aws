# Deploy — build Lambda packages + terraform apply + API Gateway redeployment
# Triggers on push to main after CI passes, or manual dispatch.
# Uses OIDC federation (keyless) — no static AWS access keys.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Required for OIDC federation (keyless AWS auth)

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + Terraform Apply
    runs-on: ubuntu-latest
    environment: aws-deploy
    # Only deploy when CI succeeded (not cancelled/failed) or manual dispatch
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::000911984950:role/news-pipeline-github-actions-role
          aws-region: eu-central-1
          role-session-name: github-actions-deploy-${{ github.run_id }}

      - name: Build Lambda deployment packages
        run: bash build.sh

      - name: Verify build artifacts
        run: |
          test -f build/pipeline/lambda_handler.py || { echo "Missing pipeline build"; exit 1; }
          test -f build/api/api_handler.py || { echo "Missing api build"; exit 1; }
          test -f build/api/demo_handler.py || { echo "Missing demo build"; exit 1; }
          echo "Build OK — pipeline: $(du -sh build/pipeline | cut -f1), api: $(du -sh build/api | cut -f1)"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve -input=false

      - name: Deploy demo UI to S3 website bucket
        run: |
          BUCKET=$(cd infra && terraform output -raw demo_site_bucket)
          aws s3 cp demo/index.html "s3://$BUCKET/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache"
          aws s3 cp demo/lang/ "s3://$BUCKET/lang/" --recursive \
            --content-type "application/json; charset=utf-8" \
            --cache-control "no-cache"
          echo "Demo UI deployed to http://$BUCKET.s3-website.$AWS_DEFAULT_REGION.amazonaws.com"

      - name: Create API Gateway Deployment
        run: |
          API_URL=$(cd infra && terraform output -raw api_base_url)
          API_ID=$(echo "$API_URL" | grep -oP '(?<=https://)[a-z0-9]+(?=\.)')
          echo "API Gateway ID: $API_ID (from $API_URL)"
          aws apigateway create-deployment \
            --rest-api-id "$API_ID" \
            --stage-name v1 \
            --region "$AWS_DEFAULT_REGION"
          echo "API Gateway deployed."

      - name: Health check
        run: |
          API_URL=$(cd infra && terraform output -raw api_base_url)
          echo "Health check: $API_URL/health"
          sleep 5
          curl -sf --max-time 10 "$API_URL/health" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'API status: {d[\"status\"]}, region: {d[\"region\"]}')"
