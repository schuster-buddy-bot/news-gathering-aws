# Security — static analysis of Terraform config with Checkov
# Runs on every PR and push to main. Scans infra/ for misconfigurations.
name: Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  checkov:
    name: Checkov (Terraform Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov scan
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          # Soft fail — warnings don't block the pipeline, only errors
          soft_fail: true

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif